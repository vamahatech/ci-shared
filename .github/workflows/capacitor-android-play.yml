name: Capacitor Android → Google Play

# For a Capacitor app: install, unit tests, web build, `cap sync android`, a signed AAB
# (refused if unsigned or debug-signed), upload to a Play track, and a GitHub Release
# with the AAB attached. A failed test means nothing is built or uploaded.
#
# The app's android/app/build.gradle must read VERSION_CODE, VERSION_NAME and the
# ANDROID_KEYSTORE_PATH / ANDROID_KEYSTORE_PASSWORD / ANDROID_KEY_ALIAS /
# ANDROID_KEY_PASSWORD env vars (see ScanDukkan's build.gradle).
#
# Caller (the job needs contents: write for the release):
#   publish:
#     permissions: { contents: write }
#     uses: vamahatech/ci-shared/.github/workflows/capacitor-android-play.yml@v1
#     with: { package-name: com.example.app, track: beta, environment: testing }
#     secrets: inherit

on:
  workflow_call:
    inputs:
      package-name:
        description: The app's applicationId, e.g. com.scandukaan.app.
        type: string
        required: true
      track:
        description: Play track - internal, alpha, beta (open testing) or production.
        type: string
        required: true
      environment:
        description: GitHub environment the job runs in (holds the signing and Play secrets).
        type: string
        required: true
      install-command:
        type: string
        default: npm ci --include=dev
      test-command:
        description: Empty to skip.
        type: string
        default: npm test
      build-command:
        type: string
        default: npm run build
      node-version:
        type: string
        default: '24'
      java-version:
        type: string
        default: '21'
      tag-suffix:
        description: Appended to the release tag v<version>.<run>, e.g. -beta. Non-empty marks it pre-release.
        type: string
        default: ''
      whatsnew-dir:
        description: Directory of whatsnew-<locale> files (≤500 chars each) uploaded as Play release notes. Empty = none.
        type: string
        default: ''
      status:
        description: Play release status - completed, inProgress (staged; needs user-fraction), draft or halted.
        type: string
        default: completed
      user-fraction:
        description: Staged rollout fraction 0-1 (exclusive). Required when status is inProgress; leave empty otherwise.
        type: string
        default: ''
    secrets:
      ANDROID_KEYSTORE_BASE64:
        required: true
      ANDROID_KEYSTORE_PASSWORD:
        required: true
      ANDROID_KEY_ALIAS:
        required: true
      ANDROID_KEY_PASSWORD:
        required: true
      PLAY_SERVICE_ACCOUNT_JSON:
        required: true
      GOOGLE_OAUTH_CLIENT_ID:
        description: Optional; exported for capacitor.config.ts during `cap sync`.
        required: false

jobs:
  publish:
    name: Test & publish signed AAB
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: ${{ inputs.environment }}
    # Never cancel a publish halfway through; queue the next one. One group per app keeps
    # versionCodes reaching Play in order across tracks.
    concurrency:
      group: publish-play-${{ github.repository }}
      cancel-in-progress: false

    env:
      NODE_ENV: production
      GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm

      - name: Install
        run: ${{ inputs.install-command }}

      - name: Unit tests
        if: inputs.test-command != ''
        run: ${{ inputs.test-command }}

      - name: Web build
        run: ${{ inputs.build-command }}

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ inputs.java-version }}
          cache: gradle

      - name: Sync web build and plugins into the Android project
        run: npx cap sync android

      # versionCode is the run number, so every upload to any track is higher than the last.
      - name: Version
        id: version
        run: |
          echo "code=${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          echo "name=$(node -p "require('./package.json').version").${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: Decode upload keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"

      - name: Build signed release bundle
        working-directory: android
        env:
          VERSION_CODE: ${{ steps.version.outputs.code }}
          VERSION_NAME: ${{ steps.version.outputs.name }}
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/upload.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew bundleRelease --no-daemon

      - name: Verify the bundle is signed
        run: |
          AAB=android/app/build/outputs/bundle/release/app-release.aab
          if ! keytool -printcert -jarfile "$AAB" | tee cert.txt | grep -q "Owner:"; then
            echo "::error::Bundle is unsigned; check the keystore secrets."; exit 1
          fi
          if grep -q "CN=Android Debug" cert.txt; then
            echo "::error::Bundle is signed with the DEBUG key; refusing to upload."; exit 1
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ github.event.repository.name }}-${{ inputs.track }}-${{ steps.version.outputs.name }}
          path: android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 90
          if-no-files-found: error

      - name: Upload to Google Play (${{ inputs.track }})
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: ${{ inputs.package-name }}
          releaseFiles: android/app/build/outputs/bundle/release/app-release.aab
          track: ${{ inputs.track }}
          status: ${{ inputs.status }}
          userFraction: ${{ inputs.user-fraction }}
          whatsNewDirectory: ${{ inputs.whatsnew-dir }}

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ steps.version.outputs.name }}${{ inputs.tag-suffix }}
          TRACK: ${{ inputs.track }}
          LATEST: ${{ inputs.tag-suffix == '' && '--latest' || '--prerelease' }}
        run: |
          gh release create "$TAG" android/app/build/outputs/bundle/release/app-release.aab \
            --target "$GITHUB_SHA" --title "$TAG ($TRACK)" --generate-notes $LATEST

      - name: Remove signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.jks"
